[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache"
version = "0.3.0"
description = "Semantic caching layer for LLM calls — match by meaning, not exact text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/0x-bala/semanticcache"
Repository = "https://github.com/0x-bala/semanticcache"
Issues = "https://github.com/0x-bala/semanticcache/issues"

[project.optional-dependencies]
transformers = ["sentence-transformers>=2.2"]
ann = ["faiss-cpu>=1.7.0"]
openai = ["openai>=1.0.0"]
cohere = ["cohere>=5.0.0"]
langchain = ["langchain-core>=0.1.0"]
llama-index = ["llama-index-core>=0.10.0"]
web = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
ollama = ["ollama>=0.4.0"]
all = [
    "faiss-cpu>=1.7.0",
    "openai>=1.0.0",
    "cohere>=5.0.0",
    "langchain-core>=0.1.0",
    "llama-index-core>=0.10.0",
    "sentence-transformers>=2.2",
    "ollama>=0.4.0",
]
dev = ["anyio>=4.0", "build>=1.2", "pytest>=7.4", "pytest-cov>=4.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: tests that make real network/API calls (opt-in)",
]

[tool.ruff]
line-length = 100
exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
