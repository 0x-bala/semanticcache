[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-cache"
version = "0.3.0"
description = "Semantic caching layer for LLM calls — match by meaning, not exact text."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.urls]
Homepage = "https://github.com/0x-bala/semanticcache"
Repository = "https://github.com/0x-bala/semanticcache"
Issues = "https://github.com/0x-bala/semanticcache/issues"

[project.optional-dependencies]
transformers = ["sentence-transformers>=2.2"]
dev = ["build>=1.2", "pytest>=7.4", "pytest-cov>=4.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["semantic_cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
